<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Solid background square with rounded corners -->
  <rect width="100" height="100" rx="20" fill="#2563eb"/>
  
  <!-- Radar / Trace concentric arcs (flat solid white with varying opacities) -->
  <path d="M 22 55 A 28 28 0 0 1 78 55" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.4"/>
  <path d="M 14 55 A 36 36 0 0 1 86 55" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.25"/>

  <!-- Minimalist Geometric Whale Silhouette -->
  <!-- Whale body & head -->
  <path d="M 24 54 C 24 44, 34 38, 50 38 C 66 38, 76 45, 82 52 C 84 54, 84 57, 80 58 C 72 60, 62 61, 50 61 C 36 61, 26 59, 24 54 Z" fill="#ffffff"/>
  
  <!-- Whale tail -->
  <path d="M 24 54 C 20 53, 16 48, 14 44 C 15 50, 15 54, 12 58 C 16 57, 21 56, 24 54 Z" fill="#ffffff"/>
  
  <!-- Whale flipper / fin -->
  <path d="M 48 59 C 45 64, 40 68, 36 68 C 38 64, 42 61, 48 59 Z" fill="#ffffff"/>
  
  <!-- Whale eye -->
  <circle cx="70" cy="48" r="2.5" fill="#2563eb"/>

  <!-- Trace Pulse / Sonar Node -->
  <circle cx="70" cy="30" r="3" fill="#ffffff"/>
  <line x1="70" y1="36" x2="70" y2="44" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
</svg>
