  <path d="M 18 43 A 22 22 0 0 1 62 43" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.25"/>

  <!-- Whale body & head -->
  <path d="M 24 43 C 24 36, 30 32, 40 32 C 50 32, 56 37, 60 41 C 61 42, 61 44, 59 45 C 54 46, 48 47, 40 47 C 32 47, 26 46, 24 43 Z" fill="#ffffff"/>
  
