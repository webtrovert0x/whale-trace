  <line x1="53" y1="30" x2="53" y2="35" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Typography -->
  <text x="84" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="-0.5">BOT WhaleTrace</text>
  <text x="84" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" letter-spacing="0.5">LARGE-TRANSFER ANALYSIS</text>
</svg>
