  <!-- Whale flipper -->
  <path d="M 39 46 C 37 49, 34 52, 31 52 C 32 49, 35 47, 39 46 Z" fill="#ffffff"/>
  
  <!-- Whale eye -->
  <circle cx="53" cy="38" r="1.8" fill="#2563eb"/>

